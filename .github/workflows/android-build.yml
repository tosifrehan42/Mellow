name: Android Debug APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Mellow Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "debug.keystore" ]; then
            echo "Existing debug.keystore found."
          elif [ -s "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore.base64 to debug.keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generating temporary debug.keystore via keytool..."
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -s "debug.keystore" || {
            echo "::error::Failed to prepare debug.keystore required by debugConfig signing."
            exit 1
          }

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated Debug APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_files=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "::error::No Debug APK found under app/build/outputs/apk/debug/"
            exit 1
          fi

          echo "Verified Debug APK output:"
          for apk in "${apk_files[@]}"; do
            if [ ! -s "$apk" ]; then
              echo "::error::Generated APK file is empty: $apk"
              exit 1
            fi
            ls -lh "$apk"
          done

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Mellow Debug APK Build Succeeded"
              echo ""
              echo "- **Artifact Name:** \`Mellow-Debug-APK\`"
              echo "- **Retention:** 30 days"
              echo "- **Generated APK(s):**"
              for apk in "${apk_files[@]}"; do
                echo "  - \`$apk\` ($(du -h "$apk" | cut -f1))"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Mellow Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
